server.port=8080
spring.application.name=MATRIQ

# File upload limits (for large CSV files)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Data storage directory (relative to working directory)
matriq.data.dir=./matriq-data

# CORS — allow React dev server
matriq.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Logging
logging.level.com.matriq=DEBUG
logging.level.org.springframework.web=INFO

# Standalone compatibility tooling is local-only.
server.address=127.0.0.1
