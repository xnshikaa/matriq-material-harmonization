server.port=8080

# CSV upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# CORS: which frontend origins may call /api/**. "*" is fine for local dev / demo.
# Before any real deployment, set this to your frontend's URL, e.g.
# app.cors.allowed-origin-patterns=https://your-app.lovable.app
app.cors.allowed-origin-patterns=*
