server.port=8081
server.address=${MATRIQ_BIND_ADDRESS:127.0.0.1}
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=MATRIQ_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${MATRIQ_SECURE_COOKIE:true}
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
matriq.state-directory=${MATRIQ_STATE_DIRECTORY:.matriq-state}
matriq.reviewer-ids=${MATRIQ_REVIEWER_IDS:}
server.servlet.session.tracking-modes=cookie
